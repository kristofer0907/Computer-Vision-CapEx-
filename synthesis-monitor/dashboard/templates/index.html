<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CapEx Synthesis Monitor</title>
<style>
  :root {
    --bg: #14161a; --panel: #1c1f25; --line: #2c313a;
    --text: #dfe3ea; --muted: #868f9e;
    --ok: #62c76a; --warn: #e0a83c; --alert: #e05252;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.45 ui-sans-serif, system-ui, "Segoe UI", sans-serif; }
  header { padding: 12px 18px; border-bottom: 1px solid var(--line);
           display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; }
  h1 { font-size: 16px; margin: 0; font-weight: 600; }
  .sub { color: var(--muted); font-size: 12px; }
  main { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; padding: 14px 18px; }
  @media (max-width: 1000px) { main { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border: 1px solid var(--line);
           border-radius: 8px; overflow: hidden; }
  .panel h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .07em;
              color: var(--muted); margin: 0; padding: 9px 12px;
              border-bottom: 1px solid var(--line); font-weight: 600; }
  img.feed { width: 100%; display: block; background: #000; }
  .stats { display: flex; gap: 18px; flex-wrap: wrap; padding: 9px 12px;
           border-top: 1px solid var(--line); font-size: 12px; }
  .stats b { font-weight: 600; font-variant-numeric: tabular-nums; }
  .stats span { color: var(--muted); }
  .pill { padding: 1px 7px; border-radius: 10px; font-size: 11px; font-weight: 600; }
  .live { background: rgba(98,199,106,.15); color: var(--ok); }
  .sim { background: rgba(224,168,60,.15); color: var(--warn); }
  .err { background: rgba(224,82,82,.16); color: var(--alert); }
  .none { background: #23272e; color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>CapEx Synthesis Monitor</h1>
  <span class="sub" id="sources">sources: —</span>
  <span class="sub">{{ n_vials }} vials</span>
</header>

<main>
  <section class="panel">
    <h2>Live camera</h2>
    <img class="feed" src="/rgb_feed" alt="live camera">
    <div class="stats" id="rgb-stats"></div>
  </section>

  <section class="panel">
    <h2>Thermal (passive view)</h2>
    <img class="feed" src="/thermal_feed" alt="thermal">
    <div class="stats" id="thermal-stats"></div>
  </section>
</main>

<script>
const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

function tag(s) {
  if (!s || s.error) return `<span class="pill err">${esc(s && s.error ? 'failed' : 'none')}</span>`;
  if (!s.name) return '<span class="pill none">starting…</span>';
  return s.simulated
    ? `<span class="pill sim">${esc(s.name)} (simulated)</span>`
    : `<span class="pill live">${esc(s.name)}</span>`;
}

function stats(s) {
  if (!s) return '';
  const c = s.counters || {};
  const age = s.last_frame_age_s == null ? '—' : s.last_frame_age_s + 's ago';
  return `<div><span>frames</span> <b>${c.frames || 0}</b></div>
          <div><span>errors</span> <b>${c.errors || 0}</b></div>
          <div><span>frame id</span> <b>${s.frame_id ?? '—'}</b></div>
          <div><span>last</span> <b>${age}</b></div>`;
}

async function refresh() {
  try {
    const st = await (await fetch('/api/state')).json();
    const s = st.sources || {};
    document.getElementById('sources').innerHTML =
      'rgb ' + tag(s.rgb) + ' &nbsp; thermal ' + tag(s.thermal);
    document.getElementById('rgb-stats').innerHTML = stats(s.rgb);
    document.getElementById('thermal-stats').innerHTML = stats(s.thermal);
  } catch (err) { console.error(err); }
}
refresh();
setInterval(refresh, {{ refresh_ms }});
</script>
</body>
</html>
